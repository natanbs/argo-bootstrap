# Example backup configuration
# See schemas/backup-config.yaml for full schema

version: "1.0"

repositories:
  - name: argo-bootstrap
    path: /Users/natan/projects/repos/argo-bootstrap
    pvc: argo-bootstrap-pvc
    data_dir: /data/argo-bootstrap
    namespace: default
    db_hook: /Users/natan/projects/repos/argo-bootstrap/hooks/db-backup.sh
    db_restore_hook: /Users/natan/projects/repos/argo-bootstrap/hooks/db-restore.sh
    
  - name: analyst
    path: /Users/natan/projects/repos/analyst
    pvc: analyst-pvc
    data_dir: /data/analyst
    namespace: default

kopia:
  repository_path: /Users/natan/.kopia-repository
  password_env: KOPIA_PASSWORD
  retention:
    daily: 7
    weekly: 4
    monthly: 12

vault:
  namespace: vault
  unseal_key_path: /Users/natan/.vault-unseal-key

database_hooks:
  timeout: 300
  mandatory: true

port_offset: 0
dns_suffix: lab=bak