# Ingress Contract

## Resource Contract
This manifest defines the required structure for ArgoCD HTTP ingress.

```yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.tls: "false"
spec:
  ingressClassName: traefik
  rules:
  - host: argocd.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 8081
```

## Behavioral Contract
- Request with Host: argocd.lab to http://<host-ip>/ (port 80) MUST be routed to argocd-server:8081
- MUST not redirect to HTTPS
- MUST work with server.insecure=true
